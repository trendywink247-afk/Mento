# ─────────────────────────────────────────────────────────────────────────────
# Mento — Production deploy workflow
#
# Triggers on version tags (v*). Builds Docker images, pushes to GHCR, then
# SSHes into the prod VPS to pull + restart containers.
#
# Required secrets (set via `gh secret set` or the repo settings UI):
#   SSH_HOST           — prod VPS IP or hostname
#   SSH_USER           — deploy user on the VPS (root for this MVP)
#   SSH_PRIVATE_KEY    — private key (full PEM/OpenSSH format)
#   SSH_PORT           — SSH port (defaults to 22 if unset)
#   SENTRY_AUTH_TOKEN  — Sentry CLI auth token (optional)
#   SENTRY_ORG         — Sentry org slug (optional)
#   SENTRY_PROJECT     — Sentry project slug (optional)
#
# GHCR auth uses the auto-provisioned GITHUB_TOKEN — no extra secret needed.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  # ── Job 1: Build and push both images to GHCR ─────────────────────────────
  build-and-push-images:
    name: Build + push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ──────────────────────────────────────────────────────────
      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/mento-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web image ──────────────────────────────────────────────────────────
      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/mento-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.geekspace.space
            NEXT_PUBLIC_SOCKET_URL=https://api.geekspace.space
            NEXT_PUBLIC_APP_ENV=production
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Job 2: Deploy to VPS over SSH ─────────────────────────────────────────
  deploy-to-server:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    environment: production

    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Inject one var for IMAGE_TAG so we don't have to interpolate inside the heredoc
          envs: IMAGE_TAG,GITHUB_ACTOR,GITHUB_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/mento

            # Pull latest compose file + scripts from git
            git fetch --tags origin
            git checkout "$IMAGE_TAG"

            # docker/metadata-action strips the leading v from semver tags
            # (v0.1.0 → image tag 0.1.0). The compose file uses ${IMAGE_TAG}
            # in the image: line, so we strip the v here to match what was
            # actually pushed to GHCR.
            IMAGE_TAG_NUM="${IMAGE_TAG#v}"

            # Log in to GHCR on the VPS so it can pull the freshly-built images
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull new images + restart with rolling update
            IMAGE_TAG="$IMAGE_TAG_NUM" \
              docker compose \
                -f infra/docker/docker-compose.prod.yml \
                --env-file .env.prod \
                pull

            IMAGE_TAG="$IMAGE_TAG_NUM" \
              docker compose \
                -f infra/docker/docker-compose.prod.yml \
                --env-file .env.prod \
                up -d --remove-orphans

            # Apply any pending Prisma migrations (bypasses PgBouncer per W63)
            docker exec mento-api-prod sh -c \
              'DATABASE_URL="$MIGRATIONS_DATABASE_URL" pnpm prisma migrate deploy'

            # Free disk
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify health after deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            # Give the api container 30s to settle, then confirm healthz
            for i in $(seq 1 12); do
              if curl -sf http://localhost:4000/healthz > /dev/null; then
                echo "API healthz OK"
                exit 0
              fi
              sleep 5
            done
            echo "API did not become healthy within 60s" >&2
            docker compose -f /srv/mento/infra/docker/docker-compose.prod.yml ps
            exit 1
