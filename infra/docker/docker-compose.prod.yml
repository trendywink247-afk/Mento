# ─────────────────────────────────────────────────────────────────────────────
# Mento — Production docker-compose
#
# Boot order:
#   postgres + redis → pgbouncer (waits postgres healthy) →
#   api (waits pgbouncer + redis healthy) → web (waits api healthy) → caddy
#
# Prerequisites:
#   - Copy .env.prod.example → .env.prod (repo root) and fill all secrets.
#   - Validate: docker compose -f infra/docker/docker-compose.prod.yml \
#                 --env-file .env.prod config
#   - First deploy: see docs/DEPLOY.md for migration + seed steps.
#
# Usage (from repo root):
#   docker compose -f infra/docker/docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# All ${VAR} references below are resolved from the --env-file at CLI invocation
# time; no service-level env_file is used so validation works without .env.prod.
#
# Connection routing:
#   api  →  pgbouncer:6432  (transaction-pool, ?pgbouncer=true)
#   prisma migrate deploy  →  postgres:5432  via MIGRATIONS_DATABASE_URL
# ─────────────────────────────────────────────────────────────────────────────

name: mento-prod

services:

  # ── Postgres 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mento-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mento}
    volumes:
      - mento_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mento} -d ${POSTGRES_DB:-mento}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Postgres is NOT exposed on the host — only the api container can reach it
    networks:
      - mento_internal

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mento-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - mento_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mento_internal

  # ── PgBouncer (connection pooler) ─────────────────────────────────────────
  # Sits between the api and Postgres. Transaction-pool mode means each query
  # borrows a server connection for its duration only — allows thousands of
  # concurrent client connections while keeping Postgres connections low.
  #
  # Key settings:
  #   DEFAULT_POOL_SIZE=25   → server-side connections to Postgres per DB
  #   MAX_CLIENT_CONN=1000   → inbound connections from the api container
  #   POOL_MODE=transaction  → required for Prisma (no prepared-statement caching)
  #   SERVER_RESET_QUERY     → cleans session state between transactions
  #
  # Prisma must connect with ?pgbouncer=true to disable prepared statements.
  # prisma migrate deploy is INCOMPATIBLE with transaction-pool mode — run it
  # against Postgres directly via MIGRATIONS_DATABASE_URL (see docs/DEPLOY.md).
  pgbouncer:
    # Pinned to a tag that exists on Docker Hub. edoburu doesn't publish a
    # specific 1.23.x; `latest` was 1.25.1 at smoke time (Wave 18 W77).
    image: edoburu/pgbouncer:latest
    container_name: mento-pgbouncer-prod
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-mento}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-mento}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `pg_isready` performs the Postgres startup-packet handshake against
      # PgBouncer's listen port — confirms the pool is up AND forwarding to
      # postgres in one shot. Three other approaches were tried and failed:
      #   - `SHOW POOLS` requires the admin DB + admin_users (Wave 18 W77)
      #   - `psql -c 'SELECT 1'` requires the psql client binary, which the
      #     edoburu/pgbouncer:latest Alpine image does NOT ship (Wave 19 W78)
      #   - `nc -z` only proves the TCP port is bound, not that auth works
      # pg_isready IS present in the image — verified by image inspection.
      # $$VAR escapes the $ so Docker Compose doesn't interpolate at parse time.
      test:
        - CMD-SHELL
        - "pg_isready -h localhost -p 6432 -U $$DB_USER -d $$DB_NAME"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mento_internal

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GHCR_OWNER:-mento}/mento-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: mento-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Database — routed through PgBouncer (transaction-pool mode).
      # ?pgbouncer=true disables Prisma's prepared-statement caching, which is
      # required for PgBouncer transaction mode.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mento}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-mento}?pgbouncer=true
      # Direct connection to Postgres — used ONLY for prisma migrate deploy.
      # PgBouncer transaction-pool is incompatible with the session-level locks
      # that Prisma's migration engine uses. See docs/DEPLOY.md.
      MIGRATIONS_DATABASE_URL: postgresql://${POSTGRES_USER:-mento}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mento}
      # Redis — constructed from redis container network alias
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ai.geekspace.space}
      # Sentry
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_BASIC: ${RAZORPAY_PLAN_BASIC:-}
      RAZORPAY_PLAN_PRO: ${RAZORPAY_PLAN_PRO:-}
      RAZORPAY_PLAN_MAX: ${RAZORPAY_PLAN_MAX:-}
      # Push notifications
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Real-time chat — enable Redis adapter for horizontal Socket.IO scaling
      SOCKET_REDIS_ADAPTER: ${SOCKET_REDIS_ADAPTER:-true}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.geekspace.space/auth/google/callback}
      # S3 / R2
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-mento-uploads}
      # OTP / SMS
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      # PostHog
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      # Admin
      ADMIN_BOOTSTRAP_PHONE: ${ADMIN_BOOTSTRAP_PHONE:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mento_internal

  # ── Next.js Web ────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/${GHCR_OWNER:-mento}/mento-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.geekspace.space}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://api.geekspace.space}
        NEXT_PUBLIC_APP_ENV: production
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-mento-web}
      secrets:
        - sentry_auth_token
    container_name: mento-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.geekspace.space}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://api.geekspace.space}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - mento_internal

  # ── Caddy reverse proxy ────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: mento-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"    # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mento_caddy_data:/data
      - mento_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - mento_internal

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  mento_pg_prod:
    driver: local
  mento_redis_prod:
    driver: local
  mento_caddy_data:
    driver: local
  mento_caddy_config:
    driver: local

# ── Secrets ────────────────────────────────────────────────────────────────
# Sentry auth token is passed via BuildKit secret mount (not ARG/ENV) to avoid
# leaking it into the image layer history.
# On the build host, write the token to /run/secrets/sentry_auth_token.
# In CI, this is handled via --secret flag in docker/build-push-action.
secrets:
  sentry_auth_token:
    file: /run/secrets/sentry_auth_token

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  mento_internal:
    driver: bridge
